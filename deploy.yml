name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun / Node.js
        uses: oven-sh/setup-bun@v1 # Jodi tumi Bun use koro, tahole eta thakbe. Node use korle node setup use korbe.
        
      - name: Install Dependencies
        run: bun install # ba npm install

      - name: Build
        run: bun run build # ba npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
